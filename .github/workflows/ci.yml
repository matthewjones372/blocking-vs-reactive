# Compiles everything, runs the correctness tests, and drives every suite's harness and the summary script end to end
# at a size that proves the plumbing and measures nothing. The performance suites are run by hand (README.md).
name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the Surefold build
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/io/github/matthewjones372
          key: surefold-${{ hashFiles('surefold.commit') }}
      - name: Build Surefold at the pinned commit
        run: |
          test -d ~/.m2/repository/io/github/matthewjones372/lark-stream-forks/0.0.0-cand-SNAPSHOT || scripts/build-surefold.sh
      - name: Compile, test, and build the JMH jar
        run: ./gradlew test installDist jmhJar
      - name: Smoke-run each suite's harness
        run: |
          mkdir -p build/ci
          scripts/run-suite.py smoke --forks 2 --warmups 1 --iterations 1 --no-build --out build/ci/smoke
          scripts/run-suite.py net-smoke --forks 1 --warmups 0 --iterations 1 --no-build --out build/ci/net-smoke
          scripts/run-suite.py memory --forks 1 --no-build --only "pending surefold-mapasync" --out build/ci/memory
          scripts/run-suite.py overload --forks 1 --no-build --only "sudden reactor-adaptive-port" --out build/ci/overload
          build/install/blocking-vs-reactive/bin/blocking-vs-reactive stacktraces > build/ci/stacktraces.txt
          java -jar build/libs/blocking-vs-reactive-jmh.jar PerElementBenchmark -p contestant=vt-plain,reactor-flatmap \
            -f 1 -wi 0 -i 1 -r 200ms
      - name: Summarise the smoke runs
        run: |
          BVR_RESULTS=build/ci scripts/summarise.py smoke net-smoke memory overload
          ! grep -q "Invalid or failed\|Not settled" build/ci/*/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: build/ci
