<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d"><title id="t">Throughput as calls in flight grow</title><desc id="d">Ops per second at 1k, 10k and 100k calls in flight for Lark mapAsync, Reactor, Pekko, Lark mapPar and plain virtual threads</desc><style>
