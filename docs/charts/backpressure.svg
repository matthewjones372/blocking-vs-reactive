<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="328" viewBox="0 0 1080 328" role="img" aria-labelledby="t d"><title id="t">Backpressure</title><desc id="d">The most elements each contestant ever had in flight, and its throughput, with 16 calls allowed</desc><style>
